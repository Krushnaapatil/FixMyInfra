# Local infrastructure dependencies (alternative to installing them directly).
# Usage: docker compose -f infra/docker-compose.yml up -d
# Services expect: PostgreSQL on localhost:5432, RabbitMQ AMQP on localhost:5672.
services:
  postgres:
    image: postgres:16-alpine
    container_name: fixmyinfra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixmyinfra
      POSTGRES_PASSWORD: fixmyinfra
      POSTGRES_DB: fixmyinfra
    ports:
      - "5432:5432"
    volumes:
      - fixmyinfra-pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fixmyinfra-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - fixmyinfra-rabbitdata:/var/lib/rabbitmq

volumes:
  fixmyinfra-pgdata:
  fixmyinfra-rabbitdata:
