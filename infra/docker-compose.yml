name: fixmyinfra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fixmyinfra
      POSTGRES_PASSWORD: fixmyinfra
      POSTGRES_DB: fixmyinfra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixmyinfra"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI - http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ../backend/api-gateway
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: dev-secret-change-me
    depends_on:
      - auth-service
      - complaint-service

  auth-service:
    build:
      context: ../backend/services/auth-service
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: postgresql://fixmyinfra:fixmyinfra@postgres:5432/fixmyinfra
      JWT_SECRET: dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

  complaint-service:
    build:
      context: ../backend/services/complaint-service
    ports:
      - "4002:4002"
    environment:
      DATABASE_URL: postgresql://fixmyinfra:fixmyinfra@postgres:5432/fixmyinfra
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  routing-service:
    build:
      context: ../backend/services/routing-service
    ports:
      - "4003:4003"
    environment:
      DATABASE_URL: postgresql://fixmyinfra:fixmyinfra@postgres:5432/fixmyinfra
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  user-department-service:
    build:
      context: ../backend/services/user-department-service
    ports:
      - "4004:4004"
    environment:
      DATABASE_URL: postgresql://fixmyinfra:fixmyinfra@postgres:5432/fixmyinfra
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ../backend/services/notification-service
    ports:
      - "4005:4005"
    environment:
      DATABASE_URL: postgresql://fixmyinfra:fixmyinfra@postgres:5432/fixmyinfra
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  reporting-service:
    build:
      context: ../backend/services/reporting-service
    ports:
      - "4006:4006"
    environment:
      DATABASE_URL: postgresql://fixmyinfra:fixmyinfra@postgres:5432/fixmyinfra
    depends_on:
      postgres:
        condition: service_healthy

  verification-service:
    build:
      context: ../backend/services/verification-service
    ports:
      - "4007:4007"
    environment:
      DATABASE_URL: postgresql://fixmyinfra:fixmyinfra@postgres:5432/fixmyinfra
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ../ai-service
    ports:
      - "8000:8000"
    volumes:
      - ai_models:/app/models_store

volumes:
  postgres_data:
  ai_models:
