name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-and-node-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build --if-present

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -c "import app.main"

  prod-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose file
        run: docker compose -f infra/docker-compose.prod.yml config --quiet
        env:
          JWT_SECRET: ci-placeholder-secret
          # Required by the gateway and every service; compose asserts it is set.
          INTERNAL_SERVICE_TOKEN: ci-placeholder-internal-service-token
          POSTGRES_PASSWORD: ci-placeholder-password
